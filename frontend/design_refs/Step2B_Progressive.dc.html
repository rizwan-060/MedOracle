famRows: fam.map((r, i) => ({ text: mkFam(r)[0] + ' (' + mkFam(r)[1] + ')', rm: () => this.setState({ fam: fam.filter((_, k) => k !== i) }) })),
medCount: plural(meds.length, 'Medication'), famCount: plural(fam.length, 'Record'),
toggleMed: () => this.setState({ medOpen: !st.medOpen }),
toggleFam: () => this.setState({ famOpen: !st.famOpen }),
drawerOpen: drawerOpen,
showFam: drawerOpen && tab === 'fam', showMed: drawerOpen && tab === 'med',
medTabCls: tab === 'med' ? 'on' : '', famTabCls: tab === 'fam' ? 'on' : '',
tabMed: () => this.setState({ tab: 'med' }), tabFam: () => this.setState({ tab: 'fam' }),
toggleDrawer: () => this.setState({ drawer: !drawerOpen }),
rel: rel, age: age, cond: cond, mName: mName, dose: dose, freq: freq,
onRel: (e) => this.setState({ rel: e.target.value }),
onFreq: (e) => this.setState({ freq: e.target.value }),
onCond: (e) => this.setState({ cond: e.target.value }),
onMName: (e) => this.setState({ mName: e.target.value }),
ageDec: () => this.setState({ age: Math.max(1, age - 1) }),
ageInc: () => this.setState({ age: Math.min(110, age + 1) }),
doseDec: () => this.setState({ dose: Math.max(5, dose - 5) }),
doseInc: () => this.setState({ dose: Math.min(2000, dose + 5) }),
saveFam: () => { const c = cond.trim(); if (!c) return; this.setState({ fam: [{ r: rel, c: c, a: age }].concat(fam), cond: '' }); },
saveMed: () => { const n = mName.trim(); if (!n) return; this.setState({ meds: [{ n: n, d: dose, f: freq }].concat(meds), mName: '' }); }
};
}
}
</script>
